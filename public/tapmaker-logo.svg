<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="tmBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090615" />
      <stop offset="50%" stop-color="#140d2a" />
      <stop offset="100%" stop-color="#0b071a" />
    </linearGradient>

    <!-- Primary Neon Gradient (Electric Purple -> Indigo -> Cyan) -->
    <linearGradient id="tmNeonGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="40%" stop-color="#a855f7" />
      <stop offset="75%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>

    <!-- Deep Facet Gradient (Left Side Depth) -->
    <linearGradient id="tmDeepViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>

    <!-- Bright Cyber Cyan -->
    <linearGradient id="tmCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Ambient Core Glow -->
    <radialGradient id="tmAuraGlow" cx="50%" cy="48%" r="52%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.42" />
      <stop offset="40%" stop-color="#06b6d4" stop-opacity="0.18" />
      <stop offset="80%" stop-color="#090615" stop-opacity="0" />
    </radialGradient>

    <!-- Glow Filters -->
    <filter id="tmGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="tmSoftGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="tmDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Base Squircle Container -->
  <rect width="512" height="512" rx="128" fill="url(#tmBgGrad)" stroke="rgba(168,85,247,0.25)" stroke-width="2.5" />

  <!-- Ambient Backdrop Glow -->
  <circle cx="256" cy="248" r="215" fill="url(#tmAuraGlow)" />

  <!-- Outer Cyber Tech Ring with Dashes -->
  <circle cx="256" cy="256" r="208" fill="none" stroke="url(#tmNeonGrad)" stroke-width="4.5" stroke-dasharray="28 14 6 14" opacity="0.55" />
  <circle cx="256" cy="256" r="188" fill="none" stroke="#a855f7" stroke-width="1.8" stroke-dasharray="5 8" opacity="0.35" />

  <!-- Tap Wave Arcs (Radiating touch / transmission waves at the top) -->
  <g filter="url(#tmSoftGlow)">
    <!-- Arc 1 (Inner Tap Wave) -->
    <path d="M 222 108 A 44 44 0 0 1 290 108" fill="none" stroke="#22d3ee" stroke-width="5" stroke-linecap="round" opacity="0.9" />
    <!-- Arc 2 (Middle Tap Wave) -->
    <path d="M 194 78 A 78 78 0 0 1 318 78" fill="none" stroke="url(#tmNeonGrad)" stroke-width="5.5" stroke-linecap="round" opacity="0.95" />
    <!-- Arc 3 (Outer Tap Wave) -->
    <path d="M 166 48 A 112 112 0 0 1 346 48" fill="none" stroke="#a855f7" stroke-width="5" stroke-linecap="round" opacity="0.75" />
  </g>

  <!-- Central Stylized 'T' Monogram with Cyber Facets -->
  <g filter="url(#tmDropShadow)">
    <!-- Group with glow filter -->
    <g filter="url(#tmGlow)">
      <!-- Crossbar: Left Wing (Deep Violet Shadow Facet) -->
      <path d="M 106 175 L 146 140 L 256 140 L 256 205 L 220 205 L 140 205 Z" 
            fill="url(#tmDeepViolet)" />
      
      <!-- Crossbar: Right Wing (Bright Neon Cyan/Purple Gradient) -->
      <path d="M 406 175 L 366 140 L 256 140 L 256 205 L 292 205 L 372 205 Z" 
            fill="url(#tmNeonGrad)" />

      <!-- Stem: Left Facet (Deep Violet Depth) -->
      <path d="M 220 205 L 256 205 L 256 415 L 220 380 Z" 
            fill="url(#tmDeepViolet)" />

      <!-- Stem: Right Facet (Luminous Neon Gradient) -->
      <path d="M 256 205 L 292 205 L 292 380 L 256 415 Z" 
            fill="url(#tmNeonGrad)" opacity="0.98" />

      <!-- Top Bevel Highlight Strip -->
      <polygon points="146,140 366,140 352,149 160,149" fill="#ffffff" opacity="0.8" />

      <!-- Central Vertical Light Ridge / Cyber Core Split -->
      <line x1="256" y1="140" x2="256" y2="415" stroke="#ffffff" stroke-width="2.5" opacity="0.85" />

      <!-- Horizontal Wing Accents -->
      <line x1="140" y1="205" x2="220" y2="205" stroke="#8b5cf6" stroke-width="2" opacity="0.6" />
      <line x1="292" y1="205" x2="372" y2="205" stroke="#22d3ee" stroke-width="2.5" opacity="0.85" />

      <!-- Central Floating Tech Diamond (Core Power Crystal) -->
      <polygon points="256,152 272,172 256,192 240,172" fill="#ffffff" />
      <polygon points="256,158 266,172 256,186 246,172" fill="#22d3ee" />
    </g>
  </g>

  <!-- Glowing Cyber Corner Nodes / Precision Vertex Pins -->
  <circle cx="106" cy="175" r="6" fill="#22d3ee" filter="url(#tmSoftGlow)" />
  <circle cx="406" cy="175" r="6" fill="#a855f7" filter="url(#tmSoftGlow)" />
  <circle cx="256" cy="415" r="7" fill="#22d3ee" filter="url(#tmSoftGlow)" />
  <circle cx="256" cy="30" r="4.5" fill="#ffffff" opacity="0.95" filter="url(#tmSoftGlow)" />

  <!-- Micro Digital Markers (Left & Right Tech Crosshairs) -->
  <line x1="60" y1="256" x2="84" y2="256" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round" opacity="0.7" />
  <line x1="428" y1="256" x2="452" y2="256" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round" opacity="0.7" />
  <circle cx="72" cy="256" r="2" fill="#a855f7" />
  <circle cx="440" cy="256" r="2" fill="#22d3ee" />
</svg>